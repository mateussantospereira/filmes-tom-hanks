# =============================================================================
# CATALOGO DE FILMES — Atividade 3: servicos desacoplados
# =============================================================================
# Dois containers, uma rede, UM ponto de entrada publico.
#
#   navegador  ->  catalogo (porta 8222, subdominio do aluno)   [publico]
#                    |
#                    |  http://auth-service:3000  (rede interna do Docker)
#                    v
#              auth-service (SEM ports:)                      [privado]
#
# O catalogo e o unico servico com `ports:`. O auth-service nao publica porta
# no host: ele so existe dentro da rede `interna`, alcancavel pelo nome do
# servico. Verifique com `docker compose ps` — so o catalogo aparece com porta.
# =============================================================================

# Os dois servicos apontam para o MESMO MariaDB (externo ao compose, como na
# atividade 2). O bloco abaixo e um "anchor": e escrito uma vez e reaproveitado
# nos dois servicos, para as credenciais nao ficarem duplicadas e divergentes.
x-db: &db
  DB_HOST: ${DB_HOST:-35.226.64.52}
  DB_PORT: ${DB_PORT:-3306}
  DB_USER: ${DB_USER:-IAC_2026_02_mateus_pereira}
  DB_PASSWORD: ${DB_PASSWORD:-o1112oo6}
  DB_NAME: ${DB_NAME:-IAC_2026_02_mateus_pereira}

services:
  # ---------------------------------------------------------------------------
  # CATALOGO — o unico container com porta publicada.
  # Nao tem mais nenhuma logica de autenticacao: ele pergunta ao auth-service.
  # ---------------------------------------------------------------------------
  app:
    build: .
    ports:
      - "8222:8222"
    environment:
      <<: *db
      TMDB_API_KEY: ${TMDB_API_KEY:-00edc4beae3dc8a06a13fc77ced0faa9}
      # Endereco do auth-service NA rede interna do Docker: nome do servico,
      # nao IP e nao localhost. Fora desta rede, "auth-service" nao existe.
      AUTH_SERVICE_URL: http://auth-service:3000
      # Teto de espera de cada chamada ao auth-service: um servico travado
      # devolve 503 em vez de segurar a requisicao do usuario.
      AUTH_SERVICE_TIMEOUT_MS: ${AUTH_SERVICE_TIMEOUT_MS:-5000}
      PORT: "8222"
      LOG_SERVICE_URL: ${LOG_SERVICE_URL:-http://log-service:3000}
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-}
    # Ordem de subida apenas: o catalogo NAO depende do auth-service estar
    # saudavel para ficar no ar. Se o auth-service cair, o catalogo continua
    # servindo filmes e so recusa o que exige autenticacao.
    depends_on:
      - auth-service
    networks:
      - interna
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:8222/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  # ---------------------------------------------------------------------------
  # AUTH-SERVICE — microsservico de autenticacao. NAO tem `ports:`.
  # Dono de: cadastro, login, papeis (role) e recuperacao de senha.
  # Fica invisivel para a internet: so o catalogo fala com ele.
  # ---------------------------------------------------------------------------
  auth-service:
    build: ./auth-service
    # (aqui nao existe `ports:` — e proposital. Sem isso, o servico de
    #  autenticacao viraria um segundo ponto de entrada publico.)
    environment:
      <<: *db
      NODE_ENV: production
      PORT: "3000"
      # O segredo de assinatura do JWT mora AQUI. O catalogo nao tem
      # JWT_SECRET: ele nem poderia forjar um token, mesmo com acesso ao codigo.
      JWT_SECRET: ${JWT_SECRET:-0ChcWFxPMJjE5Pla7CSpqpKk01iTK3ZoMHuQjkO8QkAuGd1}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      # URL publica do CATALOGO: o link de redefinicao volta a entrar por ele,
      # porque o navegador nao consegue alcançar o auth-service.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://mateus-pereira-isw055.lapps.studio}
      RESET_TOKEN_TTL_MINUTES: ${RESET_TOKEN_TTL_MINUTES:-30}
      # E-mail: em desenvolvimento, Mailtrap (sandbox). Em producao, Brevo.
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USER: ${MAIL_USER:-bbdcf182c308d9}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-6319afa2afaa8c}
      MAIL_FROM: ${MAIL_FROM:-nao-responda@sandbox.mailtrap.io}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Catalogo de Filmes}
      LOG_SERVICE_URL: ${LOG_SERVICE_URL:-http://log-service:3000}
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-}
    networks:
      - interna
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  # ---------------------------------------------------------------------------
  # REDIS — armazenamento do stream de auditoria (atividade 5). NAO tem `ports:`.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - interna
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # ---------------------------------------------------------------------------
  # LOG-SERVICE — microsservico de auditoria e observabilidade. NAO tem `ports:`.
  # ---------------------------------------------------------------------------
  log-service:
    build: ./log-service
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_STREAM: ${REDIS_STREAM:-auditoria:eventos}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-50000}
      AUTH_SERVICE_URL: http://auth-service:3000
      PERMISSAO_LEITURA: consultar:logs
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - interna
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

# A rede interna que os dois servicos compartilham. O DNS do Docker resolve
# "app" e "auth-service" dentro dela.
# Subnet explicita evita o erro "all predefined address pools have been fully subnetted"
# em servidores compartilhados com muitas redes ativas.
networks:
  interna:
    driver: bridge
    ipam:
      config:
        - subnet: 10.241.55.0/24

