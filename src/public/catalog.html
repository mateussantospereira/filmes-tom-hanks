<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — Tom Hanks</title>
  <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
  <header>
    <h1>🎬 Filmes — Tom Hanks</h1>
    <div class="header-right">
      <span id="user-name"></span>
      <span id="user-role" class="role-badge">usuario</span>
      <button onclick="logout()">Sair</button>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" data-tab="movies" onclick="switchTab('movies')">🎬 Filmes</button>
      <button class="tab-btn" data-tab="favorites" onclick="switchTab('favorites')">⭐ Favoritos</button>
      <button class="tab-btn" data-tab="perfil" onclick="switchTab('perfil')">👤 Perfil</button>
      <button class="tab-btn" id="tab-logs-btn" data-tab="logs" onclick="switchTab('logs')" style="display:none">📋 Auditoria (Logs)</button>
    </div>
    <div id="loading">Carregando filmes...</div>
    <div id="movies-grid" class="movies-grid"></div>
    <div id="logs-container" style="display:none; max-width: 1000px; margin: 0 auto 2rem auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2 style="font-size:1.2rem;">📋 Eventos de Auditoria (Redis Streams)</h2>
        <button onclick="carregarLogs()">Atualizar</button>
      </div>
      <div id="logs-list"></div>
    </div>

    <div id="perfil-container" style="display:none; max-width: 1000px; margin: 0 auto 2rem auto;">
      <div id="perfil-conteudo"></div>
    </div>

    <div id="modal" class="modal" style="display:none">
      <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-body">
          <img id="modal-poster" src="" alt="">
          <div class="modal-info">
            <h2 id="modal-title"></h2>
            <p id="modal-overview"></p>
            <div class="modal-actions">
              <button id="btn-fav" onclick="toggleFavorite()">⭐ Favoritar</button>
            </div>
            <div class="comments-section">
              <h3>Comentários da Comunidade</h3>
              <div id="comments-list"></div>
              <div class="comment-input">
                <textarea id="comment-text" placeholder="Escreva um comentário..." rows="3"></textarea>
                <button onclick="saveComment()">Salvar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!--
    ?v=N nao e enfeite: /app.js sai do servidor com cache-control: max-age=10800
    e o Cloudflare guarda por 3h. Sem um quebra-cache na URL, um deploy novo chega
    ao navegador so quando o TTL do CDN expira — e nesse meio tempo o HTML e o
    JavaScript ficam de versoes diferentes (o caso real: a aba de auditoria
    existia no HTML e o script ainda antigo a mantinha escondida).
    Basta subir o numero aqui quando mudar app.js.
  -->
  <script src="/app.js?v=4"></script>
</body>
</html>
