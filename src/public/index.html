<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Filmes — Tom Hanks</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-container">
    <h1>🎬 Catálogo de Filmes</h1>
    <h2>Tom Hanks Collection</h2>

    <div id="auth-box">
      <div id="login-form">
        <h3>Entrar</h3>
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-senha" placeholder="Senha" required>
        <button onclick="doLogin()">Entrar</button>
        <p class="toggle">Não tem conta? <a href="#" onclick="showRegister()">Cadastre-se</a></p>
        <p class="toggle"><a href="#" onclick="showForgot()">Esqueci minha senha</a></p>
      </div>

      <div id="register-form" style="display:none">
        <h3>Cadastrar</h3>
        <input type="text" id="reg-nome" placeholder="Nome" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-senha" placeholder="Senha" required>
        <button onclick="doRegister()">Cadastrar</button>
        <p class="toggle">Já tem conta? <a href="#" onclick="showLogin()">Entrar</a></p>
      </div>

      <div id="forgot-form" style="display:none">
        <h3>Esqueci minha senha</h3>
        <p class="hint">Informe seu e-mail e enviaremos um link para criar uma nova senha. O link vale por 30 minutos.</p>
        <input type="email" id="forgot-email" placeholder="Email" required>
        <button onclick="doForgot()">Enviar link de recuperação</button>
        <p class="toggle"><a href="#" onclick="showLogin()">Voltar para o login</a></p>
      </div>

      <p id="auth-error" class="error"></p>
      <p id="auth-ok" class="ok"></p>
    </div>
  </div>

  <script>
    function mostrar(form) {
      ['login', 'register', 'forgot'].forEach((id) => {
        document.getElementById(id + '-form').style.display = id === form ? 'block' : 'none';
      });
      limparAvisos();
    }
    function limparAvisos() {
      document.getElementById('auth-error').textContent = '';
      document.getElementById('auth-ok').textContent = '';
    }
    function showRegister() { mostrar('register'); }
    function showLogin() { mostrar('login'); }
    function showForgot() { mostrar('forgot'); }

    function avisar(erro) {
      limparAvisos();
      document.getElementById('auth-error').textContent = erro;
    }

    async function doLogin() {
      const email = document.getElementById('login-email').value;
      const senha = document.getElementById('login-senha').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        const data = await res.json();
        if (!res.ok) { avisar(data.error); return; }
        localStorage.setItem('token', data.token);
        localStorage.setItem('nome', data.nome);
        window.location.href = '/catalog';
      } catch { avisar('Erro de conexão'); }
    }

    async function doRegister() {
      const nome = document.getElementById('reg-nome').value;
      const email = document.getElementById('reg-email').value;
      const senha = document.getElementById('reg-senha').value;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha })
        });
        const data = await res.json();
        if (!res.ok) { avisar(data.error); return; }
        mostrar('login');
        document.getElementById('auth-ok').textContent = 'Conta criada! Faça login.';
      } catch { avisar('Erro de conexão'); }
    }

    // O catalogo nao envia e-mail: ele repassa o pedido para o auth-service,
    // que e o dono da regra e do envio (via SMTP).
    async function doForgot() {
      const email = document.getElementById('forgot-email').value;

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) { avisar(data.error); return; }
        mostrar('login');
        document.getElementById('auth-ok').textContent = data.message;
      } catch { avisar('Erro de conexão'); }
    }

    if (localStorage.getItem('token')) window.location.href = '/catalog';
  </script>
</body>
</html>
